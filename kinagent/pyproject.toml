[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinagent"
version = "0.1.2"
description = "SDK and CLI for building agents on the Kinvestor Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
  {name = "Kinvestor", email = "dev@kinvestor.us"}
]
maintainers = [
  {name = "Krishna Bhattarai", email = "dev@kinvestor.us"}
]
keywords = ["agent", "ai", "sdk", "kinvestor", "llm"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://kinvestor.us"
Repository = "https://github.com/kinvestor-platform/kinagent"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
kinagent = "kinagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kinagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py312"
